<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="theme-color" content="#ffffff">
<title>Finanzas Personales</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --text: #191919;
  --muted: #9b9a97;
  --border: #edecea;
  --accent: #2f6feD;
  --accent-soft: #eef3fe;
  --red: #d9534f;
  --green: #2f9e60;
  --yellow: #d99a2b;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 15px; -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 620px; margin: 0 auto; padding: 40px 24px 80px; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.top h1 { font-size: 17px; font-weight: 600; margin: 0; }
.top-links { display: flex; gap: 14px; }
.top-links a, .top-links button {
  font-size: 12.5px; color: var(--muted); cursor: pointer; background: none; border: none; padding: 0;
  font-family: inherit; text-decoration: none;
}
.top-links a:hover, .top-links button:hover { color: var(--text); }

.month-row { margin-bottom: 28px; }
select#monthSelect {
  border: none; background: none; color: var(--muted); font-size: 13px; font-family: inherit;
  padding: 0; -webkit-appearance: none; cursor: pointer;
}

/* tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
.tab { font-size: 13.5px; font-weight: 500; color: var(--muted); padding: 10px 0; cursor: pointer;
  border: none; background: none; font-family: inherit; border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.panel { display: none; }
.panel.active { display: block; }

/* hero */
.hero-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.hero-number { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 6px; }
.hero-sub { font-size: 13px; color: var(--muted); min-height: 16px; margin-bottom: 22px; }
.balance-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 40px; }
.balance-cell .bl-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.balance-cell .bl-value { font-size: 16px; font-weight: 600; white-space: nowrap; }

/* category list */
.section-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; }
.cat-row { padding: 12px 0; border-bottom: 1px solid var(--border); position: relative; }
.cat-row:last-child { border-bottom: none; }
.cat-row-top { display: flex; justify-content: space-between; font-size: 14.5px; margin-bottom: 7px; }
.cat-row-top .name { font-weight: 500; }
.cat-bar-bg { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.cat-bar-fill { height: 100%; border-radius: 2px; }
.cat-budget-note { font-size: 11.5px; margin-top: 6px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 20px 0; }

/* secondary */
.secondary { margin-top: 56px; padding-top: 28px; border-top: 1px solid var(--border); }
.secondary .section-label { margin-bottom: 18px; }
canvas#chartAhorro { max-height: 160px; }

/* cargar tab */
.field-block { margin-bottom: 30px; }
.field-block .section-label { margin-bottom: 16px; }
.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.cat-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px;
  border-radius: 10px; border: 1px solid var(--border); background: none; cursor: pointer;
  color: var(--text); font-weight: 500; font-size: 11.5px; font-family: inherit;
}
.cat-btn .dot { width: 8px; height: 8px; border-radius: 50%; }
.cat-btn.active { border-color: var(--text); background: #fafafa; }
.row { display: flex; gap: 10px; margin-bottom: 10px; }
.row > * { flex: 1; min-width: 0; }
input, input[type=date], input[type=month], input[type=number], input[type=text] {
  border: none; border-bottom: 1px solid var(--border); padding: 10px 2px; font-size: 14px;
  font-family: inherit; color: var(--text); background: none; outline: none; width: 100%;
}
input:focus { border-bottom-color: var(--text); }
.amount-input { font-size: 24px; font-weight: 600; }
.medio-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.chip {
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 12.5px;
  cursor: pointer; background: none; color: var(--muted); font-family: inherit;
}
.chip.active { border-color: var(--text); color: var(--text); }
.btn {
  border: none; background: var(--text); color: #fff; padding: 12px 20px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%;
}
.btn:hover { opacity: .85; }

.mic-btn {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px;
  border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
  background: none; color: var(--text); font-size: 12.5px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
.mic-btn:hover { border-color: var(--text); }
.mic-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: .6; }
.mic-btn.listening { border-color: var(--red); color: var(--red); }

/* historial tab */
.hist-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.hist-row:last-child { border-bottom: none; }
.hist-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.hist-meta { flex: 1; min-width: 0; }
.hist-meta .cat { font-size: 14px; font-weight: 500; }
.hist-meta .desc { font-size: 12px; color: var(--muted); }
.hist-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
.hist-del { color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 4px; }
.hist-del:hover { color: var(--red); }
.list-scroll { max-height: 420px; overflow-y: auto; }
.danger-link { margin-top: 14px; color: var(--muted); }
.danger-link:hover { color: var(--red); }

/* modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(20,20,20,.35); display: none;
  align-items: center; justify-content: center; z-index: 50; padding: 20px;
}
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 28px; width: 380px; max-width: 100%; }
.modal h3 { margin: 0 0 20px 0; font-size: 16px; font-weight: 600; }
.f { margin-bottom: 16px; }
.f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.link-btn { background: none; border: none; font-family: inherit; font-size: 13.5px; color: var(--muted); cursor: pointer; padding: 8px 4px; }
.link-btn:hover { color: var(--text); }

/* categorías/presupuestos en ajustes */
.cat-setting-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.cat-setting-row:last-child { border-bottom: none; }
.cat-setting-name { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-color-input { width: 22px; height: 22px; padding: 0; border: none; background: none; cursor: pointer; flex-shrink: 0; }
.cat-budget-input { width: 90px; flex: none; font-size: 13px; }
.cat-del { color: var(--muted); cursor: pointer; font-size: 14px; flex-shrink: 0; }
.cat-del:hover { color: var(--red); }
.cat-add-row { align-items: center; margin-top: 10px; }
.cat-add-row input[type=color] { flex: none; width: 28px; height: 28px; }
.cat-add-row #btnAddCat { flex: none; white-space: nowrap; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60;
}
.toast.show { opacity: 1; }

</style>
<script src="./vendor/chart.umd.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Finanzas</h1>
    <div class="top-links">
      <button id="btnSettings">Ajustes</button>
      <button id="btnImport">Importar</button>
      <button id="btnExport">Exportar</button>
      <input type="file" id="fileImport" accept="application/json" style="display:none">
    </div>
  </div>
  <div class="month-row"><select id="monthSelect"></select></div>

  <div class="tabs">
    <button class="tab active" data-tab="resumen">Resumen</button>
    <button class="tab" data-tab="cargar">Cargar</button>
    <button class="tab" data-tab="historial">Historial</button>
  </div>

  <!-- RESUMEN -->
  <div class="panel active" data-panel="resumen">
    <div class="hero-label" id="heroLabel">Gastado en julio</div>
    <div class="hero-number" id="heroNumber">$0</div>
    <div class="hero-sub" id="heroProjection"></div>

    <div class="balance-row" id="balanceRow"></div>

    <div class="section-label">Categorías principales</div>
    <div id="catList"></div>

    <div class="secondary">
      <div class="section-label">Ahorro por mes</div>
      <canvas id="chartAhorro" height="160"></canvas>
    </div>
  </div>

  <!-- CARGAR -->
  <div class="panel" data-panel="cargar">
    <div class="field-block">
      <div class="section-label">Cargar gasto</div>
      <button type="button" class="mic-btn" id="btnMicGasto">🎤 Dictar</button>
      <div class="cat-grid" id="catGrid"></div>
      <div class="row">
        <input type="number" id="inpMonto" class="amount-input" placeholder="$ Monto" inputmode="decimal">
        <input type="date" id="inpFecha">
      </div>
      <div class="row">
        <input type="text" id="inpDesc" placeholder="Descripción (opcional)">
      </div>
      <button class="btn" id="btnAdd">Agregar gasto</button>
    </div>

    <div class="field-block" style="margin-top:40px;">
      <div class="section-label">Cargar ingreso</div>
      <button type="button" class="mic-btn" id="btnMicIngreso">🎤 Dictar</button>
      <div class="row">
        <input type="text" id="inpIngFuente" placeholder="Fuente (ej. Sueldo)">
        <input type="number" id="inpIngMonto" placeholder="$ Monto" inputmode="decimal">
      </div>
      <div class="row">
        <input type="month" id="inpIngMes">
      </div>
      <button class="btn" id="btnAddIngreso">Agregar ingreso</button>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="panel" data-panel="historial">
    <div class="field-block">
      <div class="section-label">Gastos del mes</div>
      <div class="list-scroll" id="expList"></div>
      <button class="link-btn danger-link" id="btnClearMonth">Vaciar gastos de este mes</button>
    </div>
    <div class="field-block">
      <div class="section-label">Ingresos del mes</div>
      <div class="list-scroll" id="ingList"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalSettings">
  <div class="modal">
    <h3>Ajustes</h3>
    <div class="f">
      <label>Ingreso mensual fijo (ARS)</label>
      <input type="number" id="setIngreso">
    </div>
    <div class="f">
      <label>Categorías y presupuesto mensual (opcional)</label>
      <div id="catSettingsList"></div>
      <div class="row cat-add-row">
        <input type="text" id="newCatName" placeholder="Nueva categoría">
        <input type="color" id="newCatColor" value="#6B7280">
        <button class="link-btn" id="btnAddCat">+ Agregar</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="link-btn" id="btnCloseSettings">Cancelar</button>
      <button class="btn" style="width:auto;" id="btnSaveSettings">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  const STORAGE_KEY = "finanzasGastosMateo_v1";
  const DEFAULT_CATS = [
    { id: "Comida", color: "#F97316" },
    { id: "Transporte", color: "#3B82F6" },
    { id: "Vivienda", color: "#8B5CF6" },
    { id: "Servicios", color: "#06B6D4" },
    { id: "Entretenimiento", color: "#EC4899" },
    { id: "Salud", color: "#EF4444" },
    { id: "Compras", color: "#10B981" },
    { id: "Otros", color: "#6B7280" },
  ];
  function defaultData() {
    return {
      gastos: SEED_DATA.gastos.slice(),
      ingresos: Object.keys(SEED_DATA.ingresosOverride || {}).map((mk, i) => ({
        id: 900000000000 + i, mes: mk, fuente: "Ingresos (extracto bancario)", monto: SEED_DATA.ingresosOverride[mk]
      })),
      ingresoMensual: SEED_DATA.ingresoMensual,
      categorias: DEFAULT_CATS.map(c => ({ ...c })),
      presupuestos: {}
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultData();
      return Object.assign(defaultData(), JSON.parse(raw));
    } catch (e) { return defaultData(); }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("No se pudo guardar: el navegador bloqueó el almacenamiento local (por ejemplo, modo privado). Los cambios de esta sesión pueden perderse al cerrar.");
    }
  }

  let state = load();
  let selectedCat = null;

  const fmtARS = n => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(n || 0);
  const monthKey = d => d.slice(0, 7);
  const todayStr = () => new Date().toISOString().slice(0, 10);
  const catColor = id => (state.categorias.find(c => c.id === id) || {}).color || "#6B7280";

  function last12Months() {
    const arr = []; const now = new Date();
    for (let i = 11; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      arr.push(d.toISOString().slice(0, 7));
    }
    return arr;
  }
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  function monthLabel(mk) { const [y,m] = mk.split("-"); return MESES[parseInt(m,10)-1] + " " + y; }
  function monthLabelShort(mk) { const [y,m] = mk.split("-"); return MESES[parseInt(m,10)-1].slice(0,3) + " " + y.slice(2); }

  function gastosDelMes(mk) { return state.gastos.filter(g => monthKey(g.fecha) === mk); }
  function totalGastos(mk) { return gastosDelMes(mk).reduce((s,g) => s + g.monto, 0); }
  function ingresosDelMes(mk) { return state.ingresos.filter(g => g.mes === mk); }
  function ingresoDelMes(mk) {
    const items = ingresosDelMes(mk);
    return items.length ? items.reduce((s,g)=>s+g.monto,0) : state.ingresoMensual;
  }

  let chartAhorroInstance = null;

  function render() {
    const months = last12Months();
    const sel = document.getElementById("monthSelect");
    const prevVal = sel.value;
    sel.innerHTML = months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
    sel.value = months.includes(prevVal) ? prevVal : months[months.length - 1];
    const mk = sel.value;

    const gasto = totalGastos(mk);
    document.getElementById("heroLabel").textContent = "Gastado en " + monthLabel(mk);
    document.getElementById("heroNumber").textContent = fmtARS(gasto);

    const realMk = todayStr().slice(0, 7);
    const heroProj = document.getElementById("heroProjection");
    if (mk === realMk) {
      const dayNum = new Date().getDate();
      const daysInMonth = new Date(parseInt(mk.slice(0,4),10), parseInt(mk.slice(5,7),10), 0).getDate();
      if (gasto > 0 && dayNum > 0) {
        const proyeccion = (gasto / dayNum) * daysInMonth;
        heroProj.textContent = "Proyección a fin de mes: " + fmtARS(proyeccion);
      } else {
        heroProj.textContent = "";
      }
    } else {
      heroProj.textContent = "";
    }

    const ingresoMes = ingresoDelMes(mk);
    const balance = ingresoMes - gasto;
    document.getElementById("balanceRow").innerHTML = `
      <div class="balance-cell"><div class="bl-label">Ingresos</div><div class="bl-value" style="color:var(--green)">${fmtARS(ingresoMes)}</div></div>
      <div class="balance-cell"><div class="bl-label">Gastos</div><div class="bl-value">${fmtARS(gasto)}</div></div>
      <div class="balance-cell"><div class="bl-label">Balance</div><div class="bl-value" style="color:${balance >= 0 ? "var(--green)" : "var(--red)"}">${(balance >= 0 ? "+" : "-") + fmtARS(Math.abs(balance)).replace("-", "")}</div></div>`;

    const catTotals = state.categorias.map(c => ({ ...c, total: gastosDelMes(mk).filter(g => g.categoria === c.id).reduce((s,g)=>s+g.monto,0) }))
      .filter(c => c.total > 0).sort((a,b) => b.total - a.total);
    const maxTotal = catTotals.length ? catTotals[0].total : 1;
    const catList = document.getElementById("catList");
    if (!catTotals.length) {
      catList.innerHTML = `<div class="empty">Sin gastos cargados este mes.</div>`;
    } else {
      catList.innerHTML = catTotals.map(c => {
        const presu = state.presupuestos[c.id] || 0;
        let budgetNote = "";
        if (presu > 0) {
          const pct = (c.total / presu) * 100;
          const color = pct < 70 ? "var(--green)" : pct < 100 ? "var(--yellow)" : "var(--red)";
          budgetNote = `<div class="cat-budget-note" style="color:${color}">${pct.toFixed(0)}% de ${fmtARS(presu)}</div>`;
        }
        return `
        <div class="cat-row">
          <div class="cat-row-top"><span class="name">${c.id}</span><span>${fmtARS(c.total)}</span></div>
          <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(c.total/maxTotal*100).toFixed(1)}%; background:${c.color};"></div></div>
          ${budgetNote}
        </div>
      `;
      }).join("");
    }

    const btnClearMonth = document.getElementById("btnClearMonth");
    if (btnClearMonth) btnClearMonth.textContent = "Vaciar gastos de " + monthLabel(mk);

    renderExpenseList(mk);
    renderIncomeList(mk);
    renderCatButtons();
    renderChartAhorro();
  }

  function renderCatButtons() {
    const grid = document.getElementById("catGrid");
    grid.innerHTML = "";
    state.categorias.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (selectedCat === c.id ? " active" : "");
      btn.innerHTML = `<span class="dot" style="background:${c.color}"></span><span>${c.id}</span>`;
      btn.onclick = () => { selectedCat = c.id; renderCatButtons(); };
      grid.appendChild(btn);
    });
  }
  function renderExpenseList(mk) {
    const list = document.getElementById("expList");
    const items = gastosDelMes(mk).slice().sort((a,b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);
    if (!items.length) { list.innerHTML = `<div class="empty">Nada cargado este mes.</div>`; return; }
    list.innerHTML = items.map(g => `
      <div class="hist-row">
        <div class="hist-dot" style="background:${catColor(g.categoria)}"></div>
        <div class="hist-meta"><div class="cat">${g.categoria}${g.desc ? " · " + g.desc : ""}</div><div class="desc">${g.fecha}</div></div>
        <div class="hist-amt">${fmtARS(g.monto)}</div>
        <div class="hist-del" data-id="${g.id}">✕</div>
      </div>
    `).join("");
    list.querySelectorAll(".hist-del").forEach(el => {
      el.onclick = () => { state.gastos = state.gastos.filter(g => g.id !== Number(el.dataset.id)); save(); render(); };
    });
  }
  function renderIncomeList(mk) {
    const list = document.getElementById("ingList");
    const items = ingresosDelMes(mk);
    if (!items.length) { list.innerHTML = `<div class="empty">Sin ingresos cargados (usa el fijo de Ajustes: ${fmtARS(state.ingresoMensual)}).</div>`; return; }
    list.innerHTML = items.map(g => `
      <div class="hist-row">
        <div class="hist-dot" style="background:${'#2f6fed'}"></div>
        <div class="hist-meta"><div class="cat">${g.fuente}</div><div class="desc">${g.mes}</div></div>
        <div class="hist-amt">${fmtARS(g.monto)}</div>
        <div class="hist-del" data-id="${g.id}">✕</div>
      </div>
    `).join("");
    list.querySelectorAll(".hist-del").forEach(el => {
      el.onclick = () => { state.ingresos = state.ingresos.filter(g => g.id !== Number(el.dataset.id)); save(); render(); };
    });
  }

  function renderChartAhorro() {
    const ctx = document.getElementById("chartAhorro");
    const months = last12Months().slice(-6);
    const data = months.map(mk => {
      const hayActividad = ingresosDelMes(mk).length > 0 || gastosDelMes(mk).length > 0;
      return hayActividad ? ingresoDelMes(mk) - totalGastos(mk) : 0;
    });
    if (chartAhorroInstance) chartAhorroInstance.destroy();
    chartAhorroInstance = new Chart(ctx, {
      type: "bar",
      data: { labels: months.map(monthLabelShort), datasets: [{ data, backgroundColor: data.map(v => v >= 0 ? "#2f6fed" : "#d9534f"), borderRadius: 4, maxBarThickness: 28 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: "#f2f2f1" }, ticks: { color: "#9b9a97", font: { size: 10 }, callback: v => fmtARS(v) } },
          x: { grid: { display: false }, ticks: { color: "#9b9a97", font: { size: 11 } } }
        }
      }
    });
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  }

  document.querySelectorAll(".tab").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`.panel[data-panel="${btn.dataset.tab}"]`).classList.add("active");
      if (btn.dataset.tab === "resumen") renderChartAhorro();
    };
  });

  document.getElementById("inpFecha").value = todayStr();
  document.getElementById("inpIngMes").value = todayStr().slice(0,7);
  document.getElementById("monthSelect").addEventListener("change", render);

  document.getElementById("btnAdd").onclick = () => {
    const monto = parseFloat(document.getElementById("inpMonto").value);
    const fecha = document.getElementById("inpFecha").value || todayStr();
    const desc = document.getElementById("inpDesc").value.trim();
    if (!selectedCat) { toast("Elegí una categoría"); return; }
    if (!monto || monto <= 0) { toast("Ingresá un monto válido"); return; }
    state.gastos.push({ id: Date.now(), fecha, categoria: selectedCat, monto, desc });
    save();
    document.getElementById("inpMonto").value = ""; document.getElementById("inpDesc").value = "";
    toast("Gasto agregado"); render();
  };
  document.getElementById("btnAddIngreso").onclick = () => {
    const fuente = document.getElementById("inpIngFuente").value.trim() || "Ingreso";
    const monto = parseFloat(document.getElementById("inpIngMonto").value);
    const mes = document.getElementById("inpIngMes").value || todayStr().slice(0,7);
    if (!monto || monto <= 0) { toast("Ingresá un monto válido"); return; }
    state.ingresos.push({ id: Date.now(), mes, fuente, monto });
    save();
    document.getElementById("inpIngMonto").value = ""; document.getElementById("inpIngFuente").value = "";
    toast("Ingreso agregado"); render();
  };

  function renderCatSettingsList() {
    const box = document.getElementById("catSettingsList");
    box.innerHTML = state.categorias.map(c => `
      <div class="cat-setting-row" data-id="${c.id}">
        <input type="color" class="cat-color-input" value="${c.color}">
        <span class="cat-setting-name">${c.id}</span>
        <input type="number" class="cat-budget-input" placeholder="Tope $" value="${state.presupuestos[c.id] || ""}">
        <span class="cat-del" data-id="${c.id}">✕</span>
      </div>
    `).join("");
    box.querySelectorAll(".cat-del").forEach(el => {
      el.onclick = () => {
        const id = el.dataset.id;
        const enUso = state.gastos.some(g => g.categoria === id);
        if (enUso) { toast("No se puede eliminar: hay gastos con esta categoría"); return; }
        state.categorias = state.categorias.filter(c => c.id !== id);
        delete state.presupuestos[id];
        save(); renderCatSettingsList(); render();
      };
    });
  }

  document.getElementById("btnSettings").onclick = () => {
    document.getElementById("setIngreso").value = state.ingresoMensual || "";
    renderCatSettingsList();
    document.getElementById("modalSettings").classList.add("open");
  };
  document.getElementById("btnCloseSettings").onclick = () => document.getElementById("modalSettings").classList.remove("open");
  document.getElementById("btnSaveSettings").onclick = () => {
    state.ingresoMensual = parseFloat(document.getElementById("setIngreso").value) || 0;
    document.querySelectorAll("#catSettingsList .cat-setting-row").forEach(row => {
      const id = row.dataset.id;
      const color = row.querySelector(".cat-color-input").value;
      const budget = parseFloat(row.querySelector(".cat-budget-input").value) || 0;
      const cat = state.categorias.find(c => c.id === id);
      if (cat) cat.color = color;
      if (budget > 0) state.presupuestos[id] = budget; else delete state.presupuestos[id];
    });
    save(); document.getElementById("modalSettings").classList.remove("open");
    toast("Ajustes guardados"); render();
  };
  document.getElementById("btnAddCat").onclick = () => {
    const nameInput = document.getElementById("newCatName");
    const colorInput = document.getElementById("newCatColor");
    const name = nameInput.value.trim();
    if (!name) { toast("Poné un nombre de categoría"); return; }
    if (state.categorias.some(c => c.id === name)) { toast("Esa categoría ya existe"); return; }
    state.categorias.push({ id: name, color: colorInput.value || "#6B7280" });
    nameInput.value = "";
    save(); renderCatSettingsList(); render();
  };
  document.getElementById("btnClearMonth").onclick = () => {
    const mk = document.getElementById("monthSelect").value;
    if (!confirm(`¿Vaciar todos los gastos de ${monthLabel(mk)}? Esta acción no se puede deshacer.`)) return;
    state.gastos = state.gastos.filter(g => monthKey(g.fecha) !== mk);
    save(); toast("Gastos de " + monthLabel(mk) + " eliminados"); render();
  };

  document.getElementById("btnExport").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "finanzas_gastos_backup.json"; a.click();
    URL.revokeObjectURL(url);
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("fileImport").click();
  document.getElementById("fileImport").onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!confirm("Esto reemplaza los datos actuales por los del archivo importado. ¿Continuar?")) return;
        state = Object.assign(defaultData(), imported);
        save(); toast("Datos importados"); render();
      } catch (err) { toast("Archivo inválido"); }
    };
    reader.readAsText(file); e.target.value = "";
  };

  // --- Dictado por voz (Web Speech API) ---
  function normalizeText(s) {
    return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function extractMonto(text) {
    const match = text.match(/\d[\d.,]*/);
    if (!match) return null;
    let raw = match[0];
    raw = raw.replace(/\.(?=\d{3}(\D|$))/g, "");
    raw = raw.replace(",", ".");
    const n = parseFloat(raw);
    return isNaN(n) || n <= 0 ? null : n;
  }
  function extractCategoria(text) {
    const t = normalizeText(text);
    const found = state.categorias.find(c => t.includes(normalizeText(c.id)));
    return found ? found.id : null;
  }

  function setupMic(btnId, onResult) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      btn.disabled = true;
      btn.title = "Dictado por voz no disponible en este navegador";
      return;
    }
    let recognizing = false;
    const originalLabel = btn.textContent;
    btn.onclick = () => {
      if (recognizing) return;
      let recognition;
      try { recognition = new SpeechRec(); } catch (e) { toast("No se pudo iniciar el micrófono"); return; }
      recognition.lang = "es-AR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognizing = true;
      btn.classList.add("listening");
      btn.textContent = "🎙️ Escuchando…";
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        onResult(transcript);
        toast("Escuchado: “" + transcript + "”");
      };
      recognition.onerror = () => { toast("No se pudo escuchar. Probá de nuevo."); };
      recognition.onend = () => {
        recognizing = false;
        btn.classList.remove("listening");
        btn.textContent = originalLabel;
      };
      try { recognition.start(); } catch (e) { recognizing = false; btn.classList.remove("listening"); btn.textContent = originalLabel; toast("No se pudo iniciar el micrófono"); }
    };
  }

  setupMic("btnMicGasto", (transcript) => {
    const monto = extractMonto(transcript);
    const cat = extractCategoria(transcript);
    if (monto) document.getElementById("inpMonto").value = monto;
    document.getElementById("inpDesc").value = transcript;
    if (cat) { selectedCat = cat; renderCatButtons(); }
  });

  setupMic("btnMicIngreso", (transcript) => {
    const monto = extractMonto(transcript);
    if (monto) document.getElementById("inpIngMonto").value = monto;
    document.getElementById("inpIngFuente").value = transcript;
  });

  render();

  // --- PWA: registro del service worker (offline + instalable) ---
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }
})();

</script>
